name: 🔄 Supabase Keep Alive - ppdb-annur

on:
  schedule:
    # Berjalan setiap 5 hari sekali pada pukul 00:00 UTC
    - cron: '0 0 */5 * *'
  # Bisa dijalankan manual dari GitHub Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Project
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Ping Supabase REST API
        run: |
          echo "🔄 Mengirim request ke Supabase project ppdb-annur..."

          # Ping ke health endpoint Supabase
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://rwwpfkblybgiqgbdveqk.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "✅ Response HTTP Status: $RESPONSE"

          # 200 = OK, 401 = project aktif tapi butuh auth (normal), 404 = endpoint tidak ditemukan (normal)
          # Yang penting bukan 5xx (project mati/pause) atau 0 (tidak bisa konek)
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "🎉 Supabase project aktif! Project tidak akan di-pause."
          elif [ "$RESPONSE" -eq 0 ]; then
            echo "❌ Tidak dapat terhubung ke Supabase - project mungkin sudah di-pause!"
            exit 1
          else
            echo "⚠️  Server error response: $RESPONSE - perlu dicek!"
            exit 1
          fi

      - name: 📊 Log Waktu Eksekusi
        run: |
          echo "⏰ Keep-alive berhasil dijalankan pada: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📌 Project ID: rwwpfkblybgiqgbdveqk"
          echo "🏢 Organisasi: dienkazima"
